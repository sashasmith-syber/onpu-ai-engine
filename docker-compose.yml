# ONPU AI Engine - Docker Compose for Local Deployment

services:
  onpu-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onpu-ai-engine
    ports:
      - "8000:8000"
    environment:
      - ONPU_HOST=0.0.0.0
      - ONPU_PORT=8000
      - ONPU_DEBUG=false
      - ONPU_LOG_LEVEL=INFO
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Development variant with hot-reload
  onpu-engine-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onpu-ai-engine-dev
    ports:
      - "8001:8000"
    environment:
      - ONPU_HOST=0.0.0.0
      - ONPU_PORT=8000
      - ONPU_DEBUG=true
      - ONPU_LOG_LEVEL=DEBUG
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data
    command: ["python", "-m", "uvicorn", "onpu_ai_engine.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    profiles:
      - dev

volumes:
  data:
