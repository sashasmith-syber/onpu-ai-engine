[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onpu-ai-engine"
version = "0.1.0"
description = "Persona-Driven AI prompt engine optimized for KIMI K2. Expertise in text-music, SOUNDBLUEPRINT™ notation, and code-music generation."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sasha Smith", email = "sasha@example.com"}
]
keywords = [
    "ai",
    "music",
    "prompt-engineering",
    "kimi-k2",
    "sound-design",
    "music-generation",
    "agentic-ai",
    "persona-driven"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
    "openai>=1.0.0",
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "onpu-ai-engine[api,dev]",
]

[project.urls]
Homepage = "https://github.com/sashasmith-syber/onpu-ai-engine"
Repository = "https://github.com/sashasmith-syber/onpu-ai-engine"
Documentation = "https://github.com/sashasmith-syber/onpu-ai-engine#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/onpu_ai_engine"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
